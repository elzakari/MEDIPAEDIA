name: Medipaedia CI/CD Pipeline

on:
  push:
    branches: [main, master, staging]
  pull_request:
    branches: [main, master]

jobs:
  # ==========================================
  # 1. Type-Check & Frontend Validation
  # ==========================================
  typecheck-and-build:
    name: Monorepo Type-Check & Next.js Builds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Workspace Type-Checks
        run: pnpm type-check

      - name: Run Next.js Production Builds
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_API_URL: https://api.medipaedia.com

  # ==========================================
  # 2. Python Backend Unit & Integration Tests
  # ==========================================
  backend-tests:
    name: Core API Pytest Suite with PostGIS
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_USER: medipaedia_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: medipaedia_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies with uv
        run: |
          pip install uv
          uv pip install --system -r services/core-api/requirements.txt
          uv pip install --system pytest pytest-cov

      - name: Run Pytest Suite
        run: python -m pytest services/core-api/tests -v --cov=services/core-api/app
        env:
          DATABASE_URL: postgresql+asyncpg://medipaedia_test:test_password@localhost:5432/medipaedia_test_db
          SYNC_DATABASE_URL: postgresql://medipaedia_test:test_password@localhost:5432/medipaedia_test_db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test_jwt_super_secret_key_medipaedia_2026
          PRESCRIPTION_HMAC_SECRET: test_hmac_secret_prescription_32chars
          PAYSTACK_SECRET_KEY: sk_test_mock_paystack_secret_key

  # ==========================================
  # 3. Docker Image Build Verification
  # ==========================================
  docker-build-verification:
    name: Docker Multi-Stage Image Build Verification
    runs-on: ubuntu-latest
    needs: [typecheck-and-build, backend-tests]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Core API Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.api
          push: false
          tags: medipaedia-api:latest

      - name: Build Hospital Web Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.frontend
          build-args: |
            APP_NAME=hospital-web
          push: false
          tags: medipaedia-hospital-web:latest
