[project]
name = "medipaedia-core-api"
version = "0.1.0"
description = "Medipaedia Multi-Tenant Healthcare & Pharmacy Marketplace SaaS Core API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.6",
    "sqlalchemy[asyncio]>=2.0.34",
    "asyncpg>=0.29.0",
    "geoalchemy2>=0.15.2",
    "shapely>=2.0.6",
    "alembic>=1.13.2",
    "pydantic>=2.8.2",
    "pydantic-settings>=2.4.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "redis>=5.0.8",
    "httpx>=0.27.2",
    "python-multipart>=0.0.9",
    "psycopg2-binary>=2.9.9",
    "email-validator>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.2",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.4",
    "mypy>=1.11.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py311"
