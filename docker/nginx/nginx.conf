user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Extended Logging Format with latency metrics and real client IP
    log_format production_json escape=json '{'
        '"time_local":"$time_local",'
        '"remote_addr":"$remote_addr",'
        '"real_ip":"$http_cf_connecting_ip",'
        '"request":"$request",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"upstream_connect_time":"$upstream_connect_time",'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"host":"$host"'
    '}';

    access_log /var/log/nginx/access.log production_json;

    # Performance Tuning
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;
    client_max_body_size 50M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        text/xml
        application/xml
        application/xml+rss
        image/svg+xml
        application/vnd.ms-fontobject
        application/x-font-ttf
        font/opentype;

    # Rate Limiting & Concurrency Zones
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=api_general:20m rate=50r/s;
    limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=addr_conn:10m;

    # Upstream Backend Definitions
    upstream core_api_backend {
        server core-api:8000 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    upstream hospital_web_backend {
        server hospital-web:3000 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    upstream pharmacy_pos_backend {
        server pharmacy-pos:3000 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    upstream patient_store_backend {
        server patient-store:3000 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    include /etc/nginx/conf.d/*.conf;
}
